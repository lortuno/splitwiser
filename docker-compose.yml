name: travel-expenses

x-dev-image: &dev-image
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: travel-expenses-dev:local
  volumes:
    - .:/app
    - node_modules:/app/node_modules
    - api_vendor:/app/packages/api/vendor
    # The SQLite database (DB_PATH=/data/app.sqlite) lives in packages/api/var on the host, so tools outside Docker
    # can open it. The folder is git-ignored. Write to it from the host only while the api service is stopped.
    - ./packages/api/var:/data
  # Mail and security settings (feature 8). Nothing secret: Mailpit only catches mail locally.
  environment: &api-env
    MAILER_DSN: smtp://mailpit:1025
    MAIL_FROM: Travel expenses <no-reply@travel.local>
    MAILPIT_URL: http://mailpit:8025
    APP_ORIGIN: http://localhost:8081

services:
  # Catches every email the API sends; the inbox is at http://localhost:8025 and the tests read it through its API.
  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      # Set MAILPIT_PORT when 8025 is taken on the host; the API and the tests reach Mailpit inside Docker either way.
      - "${MAILPIT_PORT:-8025}:8025"

  api:
    <<: *dev-image
    depends_on:
      - mailpit
    working_dir: /app/packages/api
    command: sh -c "php bin/init-db.php && php -S 0.0.0.0:8080 -t public public/index.php"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/health') === false ? 1 : 0);"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s

  app:
    <<: *dev-image
    working_dir: /app
    command: bunx expo start --port 8081
    tty: true
    stdin_open: true
    environment:
      <<: *api-env
      EXPO_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "8081:8081"
    depends_on:
      api:
        condition: service_healthy

volumes:
  node_modules:
  api_vendor:
